<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlasmaStick</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#667eea;min-height:100vh;padding:16px;display:flex;justify-content:center;align-items:flex-start}
.card{background:#fff;border-radius:12px;width:100%;max-width:500px;overflow:hidden}
header{padding:20px 20px 0;text-align:center}
h1{font-size:21px;color:#333;margin-bottom:6px}
.badge{display:inline-block;padding:3px 12px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:2px;background:#e4e6eb;color:#3a3f4b}
.badge.on{background:#4caf50;color:#fff}
/* Health chips and problem banner */
.health{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0 2px}
.chip{font-size:12px;padding:3px 9px;border-radius:10px;background:#f1f3f9;color:#3a3f4b}
.chip.ok{background:#e7f5e8;color:#1e6b23}
.chip.bad{background:#fdecea;color:#a12622}
.alert{margin:12px 20px 0;padding:10px 12px;border-radius:8px;background:#fdecea;color:#a12622;font-size:13px;text-align:left}
/* CSS-only tabs - radio inputs drive panel visibility */
input[name=t]{display:none}
nav{display:flex;border-bottom:2px solid #eee}
nav label{flex:1;padding:11px 4px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;color:#aaa;border-bottom:3px solid transparent;transition:.15s}
nav label:hover{color:#555}
.pane{display:none;padding:20px}
#tc:checked~nav label[for=tc],
#td:checked~nav label[for=td],
#tn:checked~nav label[for=tn]{color:#667eea;border-bottom-color:#667eea}
#tc:checked~#pc,#td:checked~#pd,#tn:checked~#pn{display:block}
/* Mode buttons */
.modes{display:flex;gap:6px;margin-bottom:12px}
.modes button{flex:1;padding:9px 6px;border:1.5px solid #ddd;border-radius:7px;background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:#555}
.modes button[aria-pressed=true]{border-color:#667eea;background:#667eea;color:#fff}
.crow label{font-size:13px;color:#555}
/* Power switch: a plain Toggle button without script, a switch with it */
.power{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.power .sec{margin:0}
.switch{padding:8px 16px;border:none;border-radius:7px;background:#667eea;color:#fff;font-weight:700;cursor:pointer}
.js .switch{position:relative;width:58px;height:32px;padding:0;border-radius:16px;background:#c5c9d3;transition:.15s}
.js .switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.js .switch[aria-checked=true]{background:#4caf50}
.js .switch[aria-checked=true]::after{left:30px}
.js .switch-text{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.msg{font-size:12px;color:#a12622;min-height:16px;margin-top:4px}
/* Sections */
.sec{font-size:11px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.sec:first-child{margin-top:0}
/* Generic inputs */
.frow{display:flex;gap:8px;margin-bottom:8px}
.field{flex:1;display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:#555;font-weight:500}
input[type=text],input[type=number],input[type=password],input[type=url],select{width:100%;padding:8px 10px;border:1.5px solid #ddd;border-radius:6px;font-size:13px}
input:focus,select:focus{outline:none;border-color:#667eea}
input[type=color]{width:44px;height:36px;padding:2px;border:1.5px solid #ddd;border-radius:6px;cursor:pointer}
.crow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.crow input[type=text]{flex:1}
/* Buttons */
.btn-full:disabled{opacity:.5;cursor:default}
.btn-full{display:block;width:100%;margin-top:10px;padding:11px;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;background:#667eea;color:#fff}
footer{font-size:11px;color:#bbb;text-align:center;padding:10px 0 14px}
</style>
</head>
<body>
<div class="card">
<header>
  <h1 id="name">PlasmaStick</h1>
  <span class="badge" id="state">Loading&hellip;</span>
  <div class="health" id="health"></div>
</header>
<div class="alert" id="alert" role="alert" hidden></div>

<input type="radio" name="t" id="tc" checked>
<input type="radio" name="t" id="td">
<input type="radio" name="t" id="tn">
<nav>
  <label for="tc">Control</label>
  <label for="td">Device</label>
  <label for="tn">Network</label>
</nav>

<!-- CONTROL PANEL -->
<!-- Plain forms, so the controls still work without script; the script below
     takes them over to act without reloading the page. -->
<div class="pane" id="pc">
  <form class="power" id="power_form" action="/api/power/toggle" method="post">
    <div class="sec">Power</div>
    <button type="submit" class="switch" id="power" role="switch" aria-checked="false" aria-label="Lights on"><span class="switch-text">Toggle</span></button>
  </form>

  <div class="sec">Mode</div>
  <form id="mode_form" action="/api/mode" method="post">
    <div class="modes" role="group" aria-label="Mode">
      <button type="submit" name="mode" value="Colour" aria-pressed="false">Colour</button>
      <button type="submit" name="mode" value="Rainbows" aria-pressed="false">Rainbows</button>
      <button type="submit" name="mode" value="CheerLights" aria-pressed="false">CheerLights</button>
    </div>
    <div class="crow" id="colour_row">
      <input type="color" name="colour" id="colour" value="#ffffff">
      <label for="colour" id="colour_text">Colour</label>
    </div>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

<!-- DEVICE PANEL -->
<div class="pane" id="pd">
  <form action="/ctrl/config" method="post">
    <input type="hidden" name="tab" value="device">
    <div class="sec">Identity</div>
    <div class="frow">
      <div class="field"><label>Device Name</label>
        <input type="text" name="device_name" id="device_name" maxlength="32">
      </div>
    </div>
    <div class="sec">LED Hardware</div>
    <div class="frow">
      <div class="field"><label>LED Count</label>
        <input type="number" name="device_led_count" id="device_led_count" min="1" max="300">
      </div>
      <div class="field"><label>Type</label>
        <select name="device_led_rgbw" id="device_led_rgbw">
          <option value="false">RGB</option>
          <option value="true">RGBW</option>
        </select>
      </div>
    </div>
    <div class="sec">Defaults</div>
    <div class="frow">
      <div class="field"><label>Default State</label>
        <select name="default_state" id="default_state">
          <option value="false">OFF</option>
          <option value="true">ON</option>
        </select>
      </div>
      <div class="field"><label>Default Mode</label>
        <select name="default_mode" id="default_mode">
          <option value="Colour">Colour</option>
          <option value="Rainbows">Rainbows</option>
          <option value="CheerLights">CheerLights</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Default Colour</label>
        <div class="crow">
          <input type="color" name="default_colour" id="default_colour" value="#ffffff">
          <span style="font-size:12px;color:#888" id="default_colour_text"></span>
        </div>
      </div>
    </div>
    <div class="sec">CheerLights</div>
    <div class="frow">
      <div class="field"><label>API URL</label>
        <input type="url" name="cheerlights_url" id="cheerlights_url">
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Update Interval (s)</label>
        <input type="number" name="cheerlights_update_interval" id="cheerlights_update_interval" min="10">
      </div>
    </div>
    <div class="sec">Diagnostics</div>
    <div class="frow">
      <div class="field"><label>Log Level (USB serial log)</label>
        <select name="log_level" id="log_level">
          <option value="0">Warnings and errors</option>
          <option value="1">Info</option>
          <option value="2">Debug</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn-full save" disabled>Save &amp; Restart</button>
  </form>
</div>

<!-- NETWORK PANEL -->
<div class="pane" id="pn">
  <form action="/ctrl/config" method="post">
    <input type="hidden" name="tab" value="network">
    <div class="sec">WiFi</div>
    <div class="frow">
      <div class="field"><label>SSID (from provisioning)</label>
        <input type="text" id="ssid" disabled>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Connect Timeout (s)</label>
        <input type="number" name="connect_timeout" id="connect_timeout" min="5">
      </div>
      <div class="field"><label>Reconnect Wait (s)</label>
        <input type="number" name="reconnect_wait" id="reconnect_wait" min="5">
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Max Retries (0=unlimited)</label>
        <input type="number" name="max_retries" id="max_retries" min="0">
      </div>
    </div>
    <div class="sec">MQTT</div>
    <div class="frow">
      <div class="field"><label>Enabled</label>
        <select name="mqtt_enabled" id="mqtt_enabled">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Broker Address</label>
        <input type="text" name="broker_address" id="broker_address">
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Username</label>
        <input type="text" name="mqtt_user" id="mqtt_user">
      </div>
      <div class="field"><label>Password</label>
        <input type="password" name="mqtt_password" placeholder="leave blank to keep">
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Queue Length</label>
        <input type="number" name="queue_len" id="queue_len" min="1">
      </div>
      <div class="field"><label>Clean Session</label>
        <select name="clean" id="clean">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label>Home Assistant Discovery</label>
        <select name="ha_discovery" id="ha_discovery">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>
    <div class="sec">Web Access</div>
    <div class="frow">
      <div class="field"><label>Password (<span id="web_password_state">none set</span>)</label>
        <input type="password" name="web_password" minlength="4" placeholder="leave blank to keep" autocomplete="new-password">
      </div>
      <div class="field"><label>Remove Password</label>
        <select name="web_password_clear">
          <option value="false">No</option>
          <option value="true">Yes</option>
        </select>
      </div>
    </div>
    <p style="font-size:12px;color:#888">With a password set, the browser asks for it (any username). Forgotten it? Hold the button while powering on and complete setup, which removes it.</p>
    <button type="submit" class="btn-full save" disabled>Save &amp; Restart</button>
  </form>
</div>

<footer><span id="footer_name"></span> &bull; PlasmaStick <span id="footer_info"></span></footer>
</div>
<script>
// Values are set with .value / .textContent, never as HTML, so names and URLs
// can't inject markup. Save stays disabled until the settings have loaded, so
// a form can't post empty fields over the real config.
document.documentElement.className = 'js';
function el(id) { return document.getElementById(id); }
function sel(id, v) { el(id).value = String(v); }
var info = null;
var colourSending = false, pendingColour = null;
var modeButtons = document.querySelectorAll('.modes button');

function post(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        return j;
      });
    });
}

function say(text) { el('msg').textContent = text || ''; }

function duration(s) {
  var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm';
}

function chip(text, cls) {
  var c = document.createElement('span');
  c.className = 'chip' + (cls ? ' ' + cls : '');
  c.textContent = text;
  return c;
}

function render(i) {
  info = i;
  document.title = i.name;
  el('name').textContent = i.name;
  el('footer_name').textContent = i.name;
  if (!el('device_name').value) el('device_name').value = i.name;
  el('footer_info').textContent = '\u2022 v' + i.version + ' \u2022 up ' + duration(i.uptime_s) +
    ' \u2022 ' + Math.round(i.mem_free / 1024) + ' KB free';
  var st = el('state');
  st.textContent = i.state ? 'On' : 'Off';
  st.className = 'badge' + (i.state ? ' on' : '');
  el('power').setAttribute('aria-checked', i.state ? 'true' : 'false');
  modeButtons.forEach(function (b) { b.setAttribute('aria-pressed', b.value === i.mode ? 'true' : 'false'); });
  el('colour_row').hidden = i.mode !== 'Colour';
  // Don't overwrite a colour while it's being picked.
  if (i.colour && !colourSending && !pendingColour && document.activeElement !== el('colour')) {
    el('colour').value = i.colour.toLowerCase();
  }
  el('colour_text').textContent = i.mode === 'CheerLights' && i.colour ? 'CheerLights: ' + i.colour : 'Pick a colour';

  var health = el('health'), problems = [];
  health.textContent = '';
  var r = i.wifi.rssi;
  if (r === null) {
    health.appendChild(chip('Wi-Fi'));
  } else {
    var q = r > -60 ? 'strong' : r > -70 ? 'good' : r > -80 ? 'weak' : 'very weak';
    health.appendChild(chip('Wi-Fi ' + q + ' (' + r + ' dBm)', r > -80 ? 'ok' : 'bad'));
  }
  if (!i.mqtt.enabled) {
    health.appendChild(chip('MQTT off'));
  } else if (i.mqtt.connected) {
    health.appendChild(chip('MQTT connected', 'ok'));
  } else {
    health.appendChild(chip('MQTT not connected', 'bad'));
    problems.push('MQTT is not connected' + (i.mqtt.error ? ': ' + i.mqtt.error : '.'));
  }
  showAlert(problems.join(' '));
}

function showAlert(text) {
  el('alert').textContent = text;
  el('alert').hidden = !text;
}

function refresh() {
  return fetch('/api/info')
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function () { showAlert("Can't reach the device. It may be restarting; this page keeps trying."); });
}

// Act, then re-read the device's state once the LED controller has applied it.
function act(path, body) {
  say('');
  return post(path, body)
    .catch(function (e) { say(e.message); })
    .then(function () { setTimeout(refresh, 300); });
}

el('power').addEventListener('click', function (e) {
  e.preventDefault();
  var on = !(info && info.state);
  el('power').setAttribute('aria-checked', on ? 'true' : 'false');  // show it straight away
  act('/api/power/' + (on ? 'on' : 'off'));
});

modeButtons.forEach(function (b) {
  b.addEventListener('click', function (e) {
    e.preventDefault();
    modeButtons.forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
    el('colour_row').hidden = b.value !== 'Colour';
    var body = { mode: b.value };
    if (b.value === 'Colour') body.parameters = { Colour: el('colour').value };
    act('/api/mode', body);
  });
});

// Apply colours while picking, at most one request at a time.
function sendColour() {
  colourSending = true;
  var c = pendingColour;
  pendingColour = null;
  post('/api/mode', { mode: 'Colour', parameters: { Colour: c } })
    .catch(function (e) { say(e.message); })
    .then(function () {
      colourSending = false;
      if (pendingColour) setTimeout(sendColour, 100);
      else setTimeout(refresh, 300);
    });
}
el('colour').addEventListener('input', function () {
  say('');
  pendingColour = el('colour').value;
  if (!colourSending) sendColour();
});

refresh();
setInterval(function () { if (!document.hidden) refresh(); }, 3000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });

fetch('/api/config')
  .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function (cfg) {
    var dev = cfg.device, wl = cfg.wlan, mq = cfg.mqtt;
    var colour = (dev.mode_parameters && dev.mode_parameters.Colour) || '#ffffff';
    el('default_colour').value = colour.toLowerCase();
    el('default_colour_text').textContent = colour;
    el('device_led_count').value = dev.device_led_count;
    sel('device_led_rgbw', !!dev.device_led_rgbw);
    sel('default_state', !!dev.default_state);
    sel('default_mode', dev.default_mode);
    sel('log_level', dev.log_level);
    el('cheerlights_url').value = dev.cheerlights_url;
    el('cheerlights_update_interval').value = dev.cheerlights_update_interval;
    el('ssid').value = wl.ssid;
    el('connect_timeout').value = wl.connect_timeout;
    el('reconnect_wait').value = wl.reconnect_wait;
    el('max_retries').value = wl.max_retries;
    sel('mqtt_enabled', !!mq.enabled);
    el('broker_address').value = mq.broker_address;
    el('mqtt_user').value = mq.user;
    el('queue_len').value = mq.queue_len;
    sel('clean', !!mq.clean);
    sel('ha_discovery', !!mq.ha_discovery);
    el('web_password_state').textContent = cfg.web && cfg.web.password_set ? 'set' : 'none set';
    document.querySelectorAll('.save').forEach(function (b) { b.disabled = false; });
  })
  .catch(function (e) { showAlert('Could not load the settings (' + e.message + '). Reload to try again.'); });
</script>
</body>
</html>
